<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step on me??</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <div class="spark spark-one"></div>
        <div class="spark spark-two"></div>
        <div class="spark spark-three"></div>

        <div class="pet-photo">
          <img src="assets/girl-photo.jpg" alt="Cute girl photo" />
        </div>

        <p class="label">For the cutest girl ever</p>
        <h1>Step on me??</h1>

        <div class="button-wrap" aria-label="Answer options">
          <button id="yesBtn" class="btn btn-yes">Yes</button>
          <button id="noBtn" class="btn btn-no" type="button">No</button>
        </div>
      </div>
    </div>

    <div id="successModal" class="modal" aria-hidden="true">
      <div class="modal-card">
        <button id="closeModal" class="close-btn" aria-label="Close">×</button>
        <img src="assets/happy-boy.jpg" alt="Happy little pup" />
        <h2>The good boy is happy</h2>
        <p>Mommy is awesome</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
